<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoop Roll</title>
<style>
:root{--bg:#0b0e1a;--panel:#161b2e;--line:#283050;--text:#e8ebf5;--dim:#8a93b2;--acc:#ff7a1a;--good:#3ecf8e;--bad:#ff5c6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{margin:0;font-size:22px;color:var(--acc);letter-spacing:1px}
.stat{color:var(--dim)} .stat b{color:var(--text)}
main{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;padding:16px;max-width:1250px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
h2{margin:14px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
h2:first-child{margin-top:0}
button{background:var(--acc);color:#111;border:0;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:14px}
button.alt{background:var(--line);color:var(--text)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* shop */
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.packbtn{border-radius:12px;padding:12px 8px;text-align:center;color:#fff;cursor:pointer;border:2px solid #ffffff22;position:relative;overflow:hidden}
.packbtn b{display:block;font-size:17px}.packbtn small{display:block;opacity:.85}
.packbtn.off{opacity:.35;cursor:default}
.pk-standard{background:linear-gradient(160deg,#3b4a6b,#1d2540)}
.pk-deluxe{background:linear-gradient(160deg,#b8336a,#4a1450)}
.pk-elite{background:linear-gradient(160deg,#1fb6d6,#3a1f8c 60%,#c23cff)}
/* list cards */
.card{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:#11152a;border-left:5px solid var(--tc);margin:5px 0}
.card .ovr{font-size:19px;font-weight:800;width:34px;text-align:center;color:var(--tc)}
.card .nm{flex:1;min-width:0}.card .nm small{display:block;color:var(--dim)}
.card.holo .nm::after{content:" ✦ HOLO";color:#9ff;font-size:11px;font-weight:700}
.slot{font-size:10px;color:var(--dim);width:38px}
.x{background:none;color:var(--dim);padding:2px 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600}
tr.me td{color:var(--acc);font-weight:700}
.log{max-height:300px;overflow:auto;font-size:13px}
.log div{padding:3px 0;border-bottom:1px solid #1f2540}
.W{color:var(--good)}.Lo{color:var(--bad)}
.hidden{display:none!important}
.endbox{text-align:center;padding:18px;border-radius:12px;background:#11152a;margin-bottom:10px}
.big{font-size:34px;font-weight:900}
.odds{font-size:12px;color:var(--dim);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;font-size:12px;max-height:300px;overflow:auto}
.grid div{padding:4px 6px;border-radius:6px;background:#11152a;border-left:3px solid var(--tc)}
.grid div.no{opacity:.25;filter:grayscale(1)}

/* ---- pack opening overlay ---- */
#ov{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1b2142,#05060c);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#skip{position:absolute;top:14px;right:14px}
#stage{position:relative;width:100%;display:flex;justify-content:center;align-items:center;min-height:420px;flex-wrap:wrap;gap:14px;padding:16px}
.pack{width:190px;height:290px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:26px;letter-spacing:2px;box-shadow:0 20px 60px #000a;border:3px solid #ffffff33;animation:shake .9s ease-in-out}
.pack span{font-size:60px}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg) scale(1.03)}30%{transform:rotate(6deg)}45%{transform:rotate(-8deg) scale(1.06)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg) scale(1.1)}}
.pack.burst{animation:burst .6s forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0;filter:brightness(4)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:flash .7s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.rays{position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;pointer-events:none;opacity:.35;
  background:repeating-conic-gradient(var(--tc) 0 6deg,transparent 6deg 18deg);animation:spin 12s linear infinite;mask:radial-gradient(circle,#000 10%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
/* big flip cards */
.flip{width:160px;height:235px;perspective:900px;cursor:pointer;animation:deal .35s backwards}
@keyframes deal{from{transform:translateY(80px) scale(.6);opacity:0}}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:repeating-linear-gradient(45deg,#232a4a 0 10px,#1a2040 10px 20px);border:3px solid #3a4470;display:flex;align-items:center;justify-content:center;font-size:44px}
.front{transform:rotateY(180deg)}
.pcard{position:relative;width:100%;height:100%;border-radius:14px;padding:10px;color:#111;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 100%,#fff 30%),var(--tc) 45%,color-mix(in srgb,var(--tc) 60%,#000));box-shadow:0 0 30px color-mix(in srgb,var(--tc) 60%,transparent)}
.pcard.dark{color:#fff}
.pcard .o{font-size:38px;font-weight:900;line-height:1}
.pcard .p{font-weight:800}
.pcard .sil{position:absolute;right:8px;top:40px;font-size:64px;opacity:.85}
.pcard .n{position:absolute;left:10px;right:10px;bottom:30px;font-weight:900;font-size:16px;line-height:1.1;text-transform:uppercase}
.pcard .t{position:absolute;left:10px;bottom:9px;font-size:11px;font-weight:800;letter-spacing:2px}
.pcard.opal{background:conic-gradient(from var(--a,0deg),#ff9ad5,#9ae6ff,#b9ff9a,#fff59a,#ff9ad5);animation:opal 3s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes opal{to{--a:360deg}}
.pcard.holo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff88 45%,#9ff8 50%,transparent 65%);background-size:300% 100%;animation:sheen 2s linear infinite}
@keyframes sheen{from{background-position:100% 0}to{background-position:-100% 0}}
/* walkout */
.walk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:2}
.beam{position:absolute;top:-10%;left:50%;width:420px;margin-left:-210px;height:120%;background:linear-gradient(#fff3,transparent 80%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:beam 1s}
@keyframes beam{from{opacity:0}}
.walk .clue{font-size:64px;font-weight:900;letter-spacing:4px;animation:pop .5s;text-shadow:0 0 30px var(--tc);color:var(--tc);z-index:1}
.walk .sub{color:var(--dim);letter-spacing:3px;z-index:1}
@keyframes pop{from{transform:scale(2.2);opacity:0}}
#ovMsg{min-height:30px;margin-top:6px;font-weight:700;text-align:center}
#ov{overflow-y:auto;justify-content:safe center;padding-bottom:20px}
@media(max-width:600px){
  .flip{width:118px;height:174px}
  .pcard{padding:7px}.pcard .o{font-size:28px}.pcard .sil{font-size:42px;top:30px}
  .pcard .n{font-size:12px;bottom:30px;left:7px;right:7px}.pcard .t{font-size:9px;left:7px;bottom:7px;letter-spacing:1px}
  #stage{gap:8px;min-height:300px}.walk .clue{font-size:48px}
}
</style>
</head>

    </div>

      <h2>Standings</h2>
      <table id="standings"></table>
    </div>
    <div id="endUI" class="hidden">
      <div id="endMsg" class="endbox"></div>
      <button id="nextSeason">Next season →</button>
    </div>
    <h2>Collection book <button class="alt sm" id="colToggle">Show</button></h2>

</main>
<div id="ov" class="hidden"><button class="alt" id="skip">Skip ⏭</button><div id="stage"></div><div id="ovMsg"></div><div class="row" id="ovBtns"></div></div>

["Gary Payton II","PG",74],["Kevon Looney","C",74],["Royce O'Neale","SF",74],["Dorian Finney-Smith","PF",74],

const TIERS=[
  {k:"bronze",n:"Bronze",min:0,odds:30,c:"#c07d45",sell:10},
  {k:"silver",n:"Silver",min:78,odds:27,c:"#c3cad6",sell:20},
  {k:"gold",n:"Gold",min:82,odds:22,c:"#f2c14e",sell:40},
  {k:"ruby",n:"Ruby",min:86,odds:12,c:"#ff3b6b",sell:80},
  {k:"amethyst",n:"Amethyst",min:89,odds:6,c:"#a970ff",sell:150},
  {k:"diamond",n:"Diamond",min:92,odds:2.5,c:"#5be7ff",sell:300},
  {k:"opal",n:"Galaxy",min:95,odds:.5,c:"#ffffff",sell:600},
];
const AME=4, DIA=5;
const PACKS={
  standard:{n:"Standard",cost:1,cards:1,boost:1,icon:"📦"},
  deluxe:{n:"Deluxe",cost:3,cards:3,boost:1.7,icon:"💎"},
  elite:{n:"Elite",cost:6,cards:4,boost:2.4,guarantee:AME,icon:"👑"},
};
const ROLLS=30, MAX=10, GAMES=24, TEAMS=10, PITY=15, ROLL_PRICE=100;
const SIL={PG:"⛹️",SG:"🏃",SF:"🤾",PF:"💪",C:"🗼"};
const AI_NAMES=["Harbor Hawks","Desert Vipers","Iron Wolves","Bay Sharks","Summit Owls","Neon Foxes","Delta Gators","Granite Bears","Storm Riders"];
const tierIdx=o=>{let i=0;TIERS.forEach((t,j)=>{if(o>=t.min)i=j});return i};
const players=DB.map(([name,pos,ovr],id)=>({id,name,pos,base:ovr,ovr,ti:tierIdx(ovr)}));
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>a.sort(()=>Math.random()-.5);

function load(k,d){try{return Object.assign(d,JSON.parse(localStorage.getItem(k))||{})}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
let meta=load("hooproll-meta2",{season:1,titles:0,best:null,bestW:-1,coins:0,pity:0,col:[]});
let S, showCol=false;

function newSeason(){
  S={phase:"draft",rolls:ROLLS,roster:[],pending:[],swap:null,teams:[],sched:[],gi:0,log:[],end:""};
  render();
}

// ---------- gacha ----------
function rollTier(minI,boost){
  const opts=TIERS.map((t,i)=>({i,w:i<minI?0:t.odds*(i>=3?boost:1)}));
  let r=Math.random()*opts.reduce((a,o)=>a+o.w,0);
  for(const o of opts){ if(r<o.w) return o.i; r-=o.w; }
  return minI;
}
function drawCards(P){
  const taken=new Set([...S.roster,...S.pending].map(p=>p.id)), out=[];
  for(let i=0;i<P.cards;i++){
    let minI=0;
    if(meta.pity>=PITY-1) minI=AME;
    if(P.guarantee&&i===P.cards-1&&!out.some(c=>c.ti>=P.guarantee)) minI=P.guarantee;
    let ti=rollTier(minI,P.boost), pool=[];
    for(let t=ti;t>=0&&!pool.length;t--) pool=players.filter(p=>p.ti===t&&!taken.has(p.id));
    const base=pool[rnd(pool.length)]; taken.add(base.id);
    const holo=Math.random()<.05;
    const c={...base,holo,ovr:Math.min(99,base.base+(holo?2:0)),uid:Math.random()};
    meta.pity=c.ti>=AME?0:meta.pity+1;
    if(!meta.col.includes(c.id)) {meta.col.push(c.id); c.isNew=true;}
    out.push(c);
  }
  save("hooproll-meta2",meta);
  return out;
}
function sellValue(c){return TIERS[c.ti].sell*(c.holo?2:1)}

// ---------- pack opening animation ----------
let skipping=false;
const wait=ms=>skipping?Promise.resolve():new Promise(r=>setTimeout(r,ms));
function bigCard(c){
  const t=TIERS[c.ti];
  return `<div class="pcard ${t.k==="opal"?"opal":""} ${c.ti>=AME?"dark":""} ${c.holo?"holo":""}" style="--tc:${t.c}">
    <div class="o">${c.ovr}</div><div class="p">${c.pos}</div><div class="sil">${SIL[c.pos]}</div>
    <div class="n">${c.name}</div><div class="t">${t.n.toUpperCase()}${c.holo?" ✦ HOLO":""}${c.isNew?" · NEW":""}</div></div>`;
}
async function openPack(key){
  const P=PACKS[key];
  if(S.phase!=="draft"||S.rolls<P.cost) return;
  S.rolls-=P.cost;
  const cards=drawCards(P);
  const best=cards.reduce((a,c)=>c.ti>a.ti?c:a);
  const bt=TIERS[best.ti];
  skipping=false;
  const ov=$("ov"), st=$("stage"); $("ovMsg").textContent=""; $("ovBtns").innerHTML="";
  ov.classList.remove("hidden"); $("skip").classList.remove("hidden");
  st.innerHTML=`<div class="pack pk-${key}"><span>${P.icon}</span>${P.n.toUpperCase()}</div>`;
  await wait(950);
  st.firstChild.classList.add("burst");
  ov.insertAdjacentHTML("beforeend",`<div class="flash" style="background:${bt.c}"></div>`);
  setTimeout(()=>ov.querySelectorAll(".flash").forEach(f=>f.remove()),800);
  await wait(550);
  // walkout for Diamond+
  for(const c of cards.filter(c=>c.ti>=DIA)){
    if(skipping) break;
    const t=TIERS[c.ti];
    st.innerHTML=`<div class="walk" style="--tc:${t.c}"><div class="beam"></div><div class="sub">WALKOUT</div><div class="clue" id="clue">${t.n.toUpperCase()}</div></div>`;
    await wait(1100); if($("clue")) $("clue").outerHTML=`<div class="clue" id="clue">${c.pos}</div>`;
    await wait(1000); if($("clue")) $("clue").outerHTML=`<div class="clue" id="clue">${c.ovr}</div>`;
    await wait(1100);
  }
  st.innerHTML=`<div class="rays" style="--tc:${bt.c}"></div>`+cards.map((c,i)=>
    `<div class="flip" style="animation-delay:${i*.12}s" data-i="${i}"><div class="in"><div class="face back">🏀</div><div class="face front">${bigCard(c)}</div></div></div>`).join("");
  const flips=[...st.querySelectorAll(".flip")];
  flips.forEach(f=>f.onclick=()=>f.classList.add("on"));
  await wait(500+cards.length*120);
  for(const f of flips){ f.classList.add("on"); await wait(450); }
  $("skip").classList.add("hidden");
  $("ovMsg").innerHTML=`Best pull: <span style="color:${bt.c}">${bt.n} ${best.name}</span>`;
  $("ovBtns").innerHTML=`<button id="ovDone">Continue</button>`;
  S.pending.push(...cards);
  render();
}

// ---------- roster management ----------
function sign(i){
  const c=S.pending[i];
  if(S.roster.length<MAX){S.roster.push(c);S.pending.splice(i,1);S.swap=null}
  else S.swap=S.swap===i?null:i;
  sortRoster(); render();
}
function doSwap(ri){
  const c=S.pending[S.swap]; const old=S.roster[ri];
  S.roster[ri]=c; S.pending.splice(S.swap,1); S.pending.push(old); S.swap=null;
  sortRoster(); render();
}
function sell(c,from){
  meta.coins+=sellValue(c); from.splice(from.indexOf(c),1); S.swap=null;
  save("hooproll-meta2",meta); render();
}
function sortRoster(){S.roster.sort((a,b)=>b.ovr-a.ovr)}

// Starters weigh more; positional balance among starters matters.
const W=[1.25,1.2,1.15,1.1,1.05,.75,.6,.5,.3,.2];
function teamOvr(roster){
  const r=[...roster].sort((a,b)=>b.ovr-a.ovr);
  let s=0,ws=0;
  for(let i=0;i<MAX;i++){ s+=(r[i]?r[i].ovr:60)*W[i]; ws+=W[i]; }
  let ovr=s/ws;
  const st=r.slice(0,5).map(p=>p.pos);
  const bigs=st.filter(p=>p==="C"||p==="PF").length, guards=st.filter(p=>p==="PG"||p==="SG").length;
  if(bigs===0) ovr-=3; if(guards===0) ovr-=3; if(bigs>=4||guards>=4) ovr-=2;
  return Math.round(ovr*10)/10;
}

// ---------- season ----------
function startSeason(){
  S.pending.slice().forEach(c=>sell(c,S.pending));
  const taken=new Set(S.roster.map(p=>p.id));
  let pool=shuffle(players.filter(p=>!taken.has(p.id)));
  const bump=Math.min(meta.season-1,6);
  // [minTier,maxTier,count] per AI team; gets tougher each season
  const want=[[DIA,6,bump>=3?1:0],[AME,AME,1+(bump>=1)+(bump>=4)],[3,3,2+(bump>=2)],[2,2,3],[0,6,MAX]];
  S.teams=[{name:"You",me:true,roster:S.roster,w:0,l:0}];
  const ros=AI_NAMES.slice(0,TEAMS-1).map(()=>[]);
  // snake-style: each tier bucket is dealt round-robin so no team gets starved
  for(const [lo,hi,n] of want) for(let k=0;k<n;k++) for(const ro of ros){
    if(ro.length>=MAX) continue;
    const j=pool.findIndex(p=>p.ti>=lo&&p.ti<=hi); if(j>=0) ro.push(pool.splice(j,1)[0]);
  }
  ros.forEach((ro,i)=>S.teams.push({name:AI_NAMES[i],roster:ro,w:0,l:0}));
  S.teams.forEach(t=>t.ovr=teamOvr(t.roster));
  for(let g=0;g<GAMES;g++) S.sched.push(1+(g%(TEAMS-1)));
  S.phase="season"; render();
}
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*1.6}
function playGame(a,b,quiet){
  const diff=a.ovr-b.ovr;
  let sa=Math.round(110+diff*1.6+gauss()*11), sb=Math.round(110-diff*1.6+gauss()*11);
  while(sa===sb){sa+=rnd(8);sb+=rnd(8)}
  const g={a,b,sa,sb,win:sa>sb?a:b};
  if(!quiet) g.box=boxScore(a,sa);
  return g;
}
function boxScore(t,pts){
  const r=[...t.roster].sort((a,b)=>b.ovr-a.ovr).slice(0,5);
  const w=r.map(p=>Math.pow(p.ovr-60,1.6)*(0.7+Math.random()*.6));
  const tot=w.reduce((a,b)=>a+b,0)/0.78;
  return r.map((p,i)=>[p,Math.round(pts*w[i]/tot)]).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([p,n])=>`${p.name.split(" ").slice(-1)[0]} ${n}`).join(", ");
}
function record(g){g.win.w++; (g.win===g.a?g.b:g.a).l++}
function simGame(){
  if(S.phase!=="season") return;
  const me=S.teams[0], opp=S.teams[S.sched[S.gi]];
  const g=playGame(me,opp); record(g);
  const won=g.win===me; if(won) meta.coins+=10;
  S.log.unshift(`<span class="${won?"W":"Lo"}">${won?"W":"L"} ${g.sa}-${g.sb}</span> vs ${opp.name} · ${g.box}`);
  const others=shuffle(S.teams.slice(1).filter(t=>t!==opp));
  for(let i=0;i+1<others.length;i+=2) record(playGame(others[i],others[i+1],true));
  if(++S.gi>=GAMES) playoffs();
}
const standings=()=>[...S.teams].sort((a,b)=>b.w-a.w||b.ovr-a.ovr);
function series(a,b){
  let wa=0,wb=0;
  while(wa<4&&wb<4) playGame(a,b,true).win===a?wa++:wb++;
  return {win:wa>wb?a:b,lose:wa>wb?b:a,score:`${Math.max(wa,wb)}-${Math.min(wa,wb)}`};
}
function playoffs(){
  const st=standings(), top=st.slice(0,4), me=S.teams[0], lines=[];
  if(!top.includes(me)) lines.push(`Missed the playoffs (finished ${st.indexOf(me)+1}th).`);
  const s1=series(top[0],top[3]), s2=series(top[1],top[2]), f=series(s1.win,s2.win);
  for(const [lbl,s] of [["Semis",s1],["Semis",s2],["Finals",f]]){
    lines.push(`${lbl}: <b>${s.win.name}</b> def. ${s.lose.name} ${s.score}`);
    if(s.win===me) meta.coins+=30;
  }
  const won=f.win===me;
  if(won){meta.titles++;meta.coins+=100}
  if(me.w>meta.bestW){meta.bestW=me.w;meta.best=`${me.w}-${me.l}`}
  S.phase="end";
  S.end=`<div class="big" style="color:${won?"#ffc233":"inherit"}">${won?"🏆 CHAMPIONS!":"Season over"}</div>
    <div>Record ${me.w}-${me.l} · Team OVR ${me.ovr}</div><div class="stat" style="margin-top:8px">${lines.join("<br>")}</div>
    <div class="stat" style="margin-top:8px">Coins earned: wins ×10, series wins +30, title +100. Spend them on extra rolls next season.</div>`;
  save("hooproll-meta2",meta);
}

// ---------- render ----------
function listCard(c,extra=""){
  const t=TIERS[c.ti];
  return `<div class="card ${c.holo?"holo":""}" style="--tc:${t.c}"><span class="ovr">${c.ovr}</span><span class="nm">${c.name}<small>${c.pos} · ${t.n}${c.isNew?" · NEW":""}</small></span>${extra}</div>`;
}
function render(){
  $("sSeason").textContent=meta.season; $("sRolls").textContent=S.rolls; $("sCoins").textContent=meta.coins;
  $("sTitles").textContent=meta.titles; $("sBest").textContent=meta.best||"—";
  $("sCol").textContent=`${meta.col.length}/${players.length}`;
  $("sOvr").textContent=S.roster.length?teamOvr(S.roster):"—";
  for(const p of ["draft","season","end"]) $(p+"UI").classList.toggle("hidden",S.phase!==p);

  $("rosterCount").textContent=`${S.roster.length}/${MAX}`;
  $("roster").innerHTML=S.roster.map((c,i)=>listCard(c,
    `<span class="slot">${i<5?"START":"BENCH"}</span>`+
    (S.phase!=="draft"?"":S.swap!=null?`<button class="sm" data-swap="${i}">Swap in</button>`:`<button class="x sm" data-rsell="${i}" title="Quick sell">✕ ${sellValue(c)}c</button>`))).join("")
    || `<div class="stat">No players yet.</div>`;

  if(S.phase==="draft"){
    $("packs").innerHTML=Object.entries(PACKS).map(([k,P])=>
      `<div class="packbtn pk-${k} ${S.rolls<P.cost?"off":""}" data-pack="${k}"><b>${P.icon} ${P.n}</b><small>${P.cards} card${P.cards>1?"s":""} · ${P.cost} roll${P.cost>1?"s":""}</small>${P.guarantee?"<small>Amethyst+ guaranteed</small>":P.boost>1?"<small>Better odds</small>":""}</div>`).join("");
    $("odds").innerHTML="Base odds: "+TIERS.map(t=>`<span style="color:${t.c}">${t.n} ${t.odds}%</span>`).join(" · ");
    $("pity").textContent=`Pity: Amethyst+ guaranteed in ${PITY-meta.pity} pulls`;
    $("buyRoll").disabled=meta.coins<ROLL_PRICE;
    $("pendHint").textContent=S.swap!=null?"— pick a roster player to swap out":"";
    $("pending").innerHTML=S.pending.map((c,i)=>listCard(c,
      `<button class="sm" data-sign="${i}">${S.roster.length<MAX?"Sign":S.swap===i?"Cancel":"Swap…"}</button><button class="alt sm" data-sell="${i}">Sell ${sellValue(c)}c</button>`)).join("")
      || `<div class="stat">${S.rolls?"Open a pack to pull players.":"Out of rolls."}</div>`;
    $("startBtn").disabled=S.roster.length<5;
    $("startHint").textContent=S.roster.length<5?"Need at least 5 signed players.":S.pending.length?"Unsigned pulls get quick-sold.":S.rolls?`${S.rolls} rolls unused (they don't carry over).`:"";
  }
  if(S.phase==="season"){
    $("gameNo").textContent=`Game ${S.gi}/${GAMES}`;
    $("standings").innerHTML="<tr><th>#</th><th>Team</th><th>W-L</th><th>OVR</th></tr>"+
      standings().map((t,i)=>`<tr class="${t.me?"me":""}"><td>${i+1}</td><td>${t.name}</td><td>${t.w}-${t.l}</td><td>${t.ovr}</td></tr>`).join("");
  }
  if(S.phase==="end") $("endMsg").innerHTML=S.end;
  $("log").innerHTML=S.log.map(l=>`<div>${l}</div>`).join("")||`<div class="stat">No games yet.</div>`;
  $("colGrid").classList.toggle("hidden",!showCol); $("colToggle").textContent=showCol?"Hide":"Show";
  if(showCol){
    const have=new Set(meta.col);
    $("colGrid").innerHTML=[...players].sort((a,b)=>b.ovr-a.ovr).map(p=>
      `<div class="${have.has(p.id)?"":"no"}" style="--tc:${TIERS[p.ti].c}"><b>${p.ovr}</b> ${have.has(p.id)?p.name:"???"}</div>`).join("");
  }
}

document.addEventListener("click",e=>{
  const pk=e.target.closest("[data-pack]"); if(pk){openPack(pk.dataset.pack);return}
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(b.id==="skip") skipping=true;
  else if(b.id==="ovDone"){$("ov").classList.add("hidden");S.pending.forEach(c=>c.isNew=false);render()}
  else if(d.sign!=null) sign(+d.sign);
  else if(d.sell!=null) sell(S.pending[+d.sell],S.pending);
  else if(d.rsell!=null) sell(S.roster[+d.rsell],S.roster);
  else if(d.swap!=null) doSwap(+d.swap);
  else if(b.id==="buyRoll"&&meta.coins>=ROLL_PRICE){meta.coins-=ROLL_PRICE;S.rolls++;save("hooproll-meta2",meta);render()}
  else if(b.id==="startBtn") startSeason();
  else if(b.id==="simOne"){simGame();render()}
  else if(b.id==="simFive"){for(let i=0;i<5;i++)simGame();render()}
  else if(b.id==="simAll"){while(S.phase==="season")simGame();render()}
  else if(b.id==="nextSeason"){meta.season++;save("hooproll-meta2",meta);newSeason()}
  else if(b.id==="colToggle"){showCol=!showCol;render()}
});
newSeason();
</script>
